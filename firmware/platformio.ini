[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    adafruit/DHT sensor library@^1.4
    adafruit/Adafruit Unified Sensor
    claws/BH1750@^1.3
